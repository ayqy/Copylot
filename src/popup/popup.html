<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copylot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="popup-content">
      <main class="popup-container">
        <header class="header">
          <div class="brand">
            <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
              <rect x="2" y="2" width="28" height="28" rx="8" fill="#4f46e5" />
              <g transform="translate(16, 16)" fill="none" stroke="white" stroke-width="1.6">
                <g transform="scale(0.8) translate(-12, -12)">
                  <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </g>
              </g>
            </svg>
            <div>
              <strong data-i18n="appName">Copylot</strong>
              <span data-i18n="popupProductTagline">把网页整理成可用内容</span>
            </div>
          </div>
          <div class="header-meta">
            <span id="dev-badge" class="dev-badge" hidden>DEV</span>
            <span class="version" id="version-display"></span>
          </div>
        </header>

        <section class="copy-panel" aria-labelledby="popup-copy-title">
          <div class="section-heading">
            <div>
              <h1 id="popup-copy-title" data-i18n="popupCopyTitle">复制当前内容</h1>
              <p data-i18n="popupCopyDescription">有选区时复制选区，否则自动整理整页。</p>
            </div>
          </div>

          <button
            type="button"
            id="convert-button"
            class="copy-button"
            aria-describedby="copy-action-status"
          >
            <span class="copy-button-content">
              <span class="copy-button-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2" />
                </svg>
              </span>
              <span id="convert-button-label" data-i18n="convertButton">复制给 AI</span>
            </span>
            <span id="convert-shortcut" class="shortcut-hint">Alt+C</span>
          </button>

          <p
            id="copy-action-status"
            class="copy-action-status"
            role="status"
            aria-live="polite"
            hidden
          ></p>

          <div id="append-session-card" class="append-session-card" hidden>
            <div class="append-session-copy">
              <span class="append-session-dot" aria-hidden="true"></span>
              <div>
                <strong id="append-session-title">已收集 1 段内容</strong>
                <p id="append-session-description">继续复制下一段，或清空本次收集。</p>
              </div>
            </div>
            <button
              type="button"
              id="append-session-reset-button"
              class="text-button"
              data-i18n="popupAppendSessionReset"
            >
              清空
            </button>
          </div>
        </section>

        <section
          id="quick-prompts-section"
          class="quick-prompts-section"
          aria-labelledby="popup-quick-prompts-title"
          hidden
        >
          <div class="section-heading compact-heading">
            <div>
              <h2 id="popup-quick-prompts-title" data-i18n="popupQuickPromptsTitle">快捷 Prompt</h2>
              <p data-i18n="popupQuickPromptsDescription">复制内容时直接套用你的常用指令。</p>
            </div>
          </div>
          <div class="quick-prompts-list">
            <button type="button" id="quick-prompt-slot-1-button" class="prompt-action" hidden>
              <span id="quick-prompt-slot-1-title"></span>
              <span id="quick-prompt-slot-1-shortcut" class="shortcut-hint subtle">Alt+1</span>
            </button>
            <button type="button" id="quick-prompt-slot-2-button" class="prompt-action" hidden>
              <span id="quick-prompt-slot-2-title"></span>
              <span id="quick-prompt-slot-2-shortcut" class="shortcut-hint subtle">Alt+2</span>
            </button>
            <button type="button" id="quick-prompt-slot-3-button" class="prompt-action" hidden>
              <span id="quick-prompt-slot-3-title"></span>
              <span id="quick-prompt-slot-3-shortcut" class="shortcut-hint subtle">Alt+3</span>
            </button>
          </div>
        </section>

        <form id="settings-form" class="settings-form">
          <div class="switch-card">
            <div class="switch-copy">
              <span class="switch-title" data-i18n="enableFeature">启用智能复制</span>
              <small data-i18n="popupEnableFeatureHint">在网页中显示智能复制入口。</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="enable-magic-copy-switch" />
              <span class="slider round"></span>
            </label>
          </div>

          <button
            type="button"
            id="toggle-more-settings"
            class="settings-toggle"
            aria-expanded="false"
          >
            <span id="toggle-more-settings-label" data-i18n="expandMoreSettings">更多复制设置</span>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M3.5 5.25 7 8.75l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <div id="more-settings-panel" class="more-settings-panel" hidden>
            <div class="switch-card compact">
              <div class="switch-copy">
                <span class="switch-title" data-i18n="enableHoverTrigger">悬停触发</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="enable-hover-magic-copy-switch" />
                <span class="slider round"></span>
              </label>
            </div>

            <div class="switch-card compact">
              <div class="switch-copy">
                <span class="switch-title" data-i18n="enableClipboardAccumulator">追加模式</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="enable-clipboard-accumulator-switch" />
                <span class="slider round"></span>
              </label>
            </div>

            <fieldset class="setting-row">
              <legend data-i18n="interactionMode">触发方式</legend>
              <div class="segmented-control">
                <label>
                  <input type="radio" name="interactionMode" value="click" id="interaction-click" />
                  <span data-i18n="singleClick">单击</span>
                </label>
                <label>
                  <input type="radio" name="interactionMode" value="dblclick" id="interaction-dblclick" />
                  <span data-i18n="doubleClick">双击</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="setting-row">
              <legend data-i18n="outputFormat">内容格式</legend>
              <div class="segmented-control">
                <label>
                  <input type="radio" name="outputFormat" value="markdown" id="format-markdown" />
                  <span data-i18n="markdown">Markdown</span>
                </label>
                <label>
                  <input type="radio" name="outputFormat" value="plaintext" id="format-plaintext" />
                  <span data-i18n="plaintext">纯文本</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="setting-row">
              <legend data-i18n="tableOutputFormat">表格格式</legend>
              <div class="segmented-control">
                <label>
                  <input type="radio" name="tableOutputFormat" value="markdown" id="table-format-markdown" />
                  <span data-i18n="markdown">Markdown</span>
                </label>
                <label>
                  <input type="radio" name="tableOutputFormat" value="csv" id="table-format-csv" />
                  <span data-i18n="csv">CSV</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="setting-row">
              <legend data-i18n="additionalInfo">附加信息</legend>
              <div class="check-options">
                <label><input type="checkbox" id="attach-title" /><span data-i18n="attachTitle">页面标题</span></label>
                <label><input type="checkbox" id="attach-url" /><span data-i18n="attachURL">来源 URL</span></label>
              </div>
            </fieldset>
          </div>
        </form>

        <nav class="utility-actions" aria-label="Copylot">
          <button type="button" id="open-shortcut-settings-button" class="utility-button">
            <span data-i18n="shortcutSettingsTitle">快捷键</span>
          </button>
          <button type="button" id="add-prompt-button" class="utility-button">
            <span data-i18n="managePrompts">管理 Prompt</span>
          </button>
          <button type="button" id="upgrade-pro-entry" class="utility-button">
            <span data-i18n="upgradePro">Pro 规划</span>
          </button>
        </nav>
        <p id="shortcut-settings-feedback" class="inline-feedback" role="status" hidden></p>

        <footer class="footer">
          <a href="#" id="feedback-link" data-i18n="feedback">反馈</a>
          <a href="#" id="share-link" data-i18n="shareWithFriends">分享</a>
          <button type="button" id="copy-share-button" data-i18n="copyShareText">复制分享文案</button>
          <a href="#" id="rate-link" data-i18n="rateUs">评价</a>
        </footer>
      </main>
      <script type="module" src="popup.js"></script>
    </div>
  </body>
</html>
